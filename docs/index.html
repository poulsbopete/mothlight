<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Mothlight: Seek Light — guide a glowing moth through a moonlit forest." />
  <title>Mothlight: Seek Light</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #e8f0e4;
      --muted: #9aab9a;
      --glow: #b8f06a;
      --rule: rgba(184, 240, 106, 0.18);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Source Sans 3", system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse 70% 45% at 50% 0%, rgba(184, 240, 106, 0.16), transparent 55%),
        radial-gradient(ellipse 50% 35% at 85% 90%, rgba(60, 90, 140, 0.22), transparent 50%),
        linear-gradient(165deg, #070b0a 0%, #0f1a14 45%, #0a1018 100%);
    }

    main {
      width: min(28rem, calc(100% - 2.5rem));
      text-align: center;
      padding: 2.5rem 0 3rem;
    }

    h1 {
      font-family: Fraunces, Georgia, serif;
      font-weight: 700;
      font-size: clamp(2.4rem, 8vw, 3.2rem);
      line-height: 1.05;
      margin: 0 0 0.75rem;
      color: var(--glow);
    }

    .tag {
      margin: 0 0 1.75rem;
      color: var(--muted);
      font-size: 1.08rem;
      line-height: 1.5;
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      justify-content: center;
    }

    a.btn {
      display: inline-block;
      padding: 0.7rem 1.15rem;
      border-radius: 999px;
      border: 1px solid var(--rule);
      background: rgba(184, 240, 106, 0.12);
      color: var(--glow);
      text-decoration: none;
      font-weight: 600;
    }
    a.btn:hover {
      background: rgba(184, 240, 106, 0.22);
      color: #d4ff9a;
    }
    a.btn.ghost {
      background: transparent;
      color: var(--ink);
    }

    footer {
      margin-top: 2.5rem;
      color: var(--muted);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>Mothlight</h1>
    <p class="tag">Seek Light — an endless moth flight through a moonlit forest.</p>
    <div class="links">
      <a class="btn" href="privacy.html">Privacy Policy</a>
      <a class="btn ghost" href="mailto:privacy@poulsbopete.com">Contact</a>
    </div>
    <footer>Peter Simkins</footer>
  </main>
</body>
</html>
